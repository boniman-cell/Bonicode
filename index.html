<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonicode AI Studio</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: #0f0f0f;
    color: white;
}

header {
    padding: 10px;
    text-align: center;
    background: #1c1c1c;
}

.container {
    display: flex;
    height: 90vh;
}

#left {
    width: 50%;
    padding: 10px;
    background: #111;
}

textarea {
    width: 100%;
    height: 70%;
    background: black;
    color: #00ff88;
    border: none;
    padding: 10px;
    font-size: 14px;
}

button {
    padding: 10px;
    margin-top: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

#run {
    background: #00c26f;
    color: white;
}

#ai {
    background: #2d6cff;
    color: white;
}

#right {
    width: 50%;
    background: white;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<header>Bonicode AI Studio ⚡</header>

<div class="container">

<!-- LEFT SIDE -->
<div id="left">

<h3>Code Editor</h3>

<textarea id="code"><!DOCTYPE html>
<html>
<body>
<h1>Hello World</h1>
</body>
</html></textarea>

<br>

<button id="run">Run ▶</button>
<button id="ai">AI Fix 🤖</button>

</div>

<!-- RIGHT SIDE -->
<div id="right">
<iframe id="frame"></iframe>
</div>

</div>

<script>

// RUN BUTTON
document.getElementById("run").onclick = () => {
    const code = document.getElementById("code").value;
    document.getElementById("frame").srcdoc = code;
};

// AI FIX BUTTON (CORRECT POST REQUEST)
document.getElementById("ai").onclick = async () => {

    const code = document.getElementById("code").value;

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: code
            })
        });

        const data = await res.json();

        alert(data.reply || data.error || "No response");

    } catch (err) {
        alert("Error: " + err.message);
    }
};

</script>

</body>
</html>
