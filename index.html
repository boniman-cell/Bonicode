<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonicode AI Studio Pro</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: #0f0f0f;
    color: white;
}

header {
    padding: 10px;
    text-align: center;
    background: #1c1c1c;
    font-weight: bold;
}

.container {
    display: flex;
    height: 90vh;
}

/* EDITOR */
#editor {
    width: 50%;
    padding: 10px;
    background: #111;
}

textarea {
    width: 100%;
    height: 75%;
    background: black;
    color: #00ff88;
    border: none;
    padding: 10px;
}

/* BUTTONS */
.buttons {
    margin-top: 10px;
}

button {
    padding: 8px;
    margin-right: 5px;
    border: none;
    cursor: pointer;
}

#run { background: #00c26f; color: white; }
#ai { background: #2d6cff; color: white; }
#clear { background: #aa3333; color: white; }

/* PREVIEW */
#preview {
    width: 50%;
    background: white;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<header>Bonicode AI Studio Pro ⚡</header>

<div class="container">

<!-- LEFT SIDE -->
<div id="editor">

<h3>Code Editor</h3>

<textarea id="code"><!DOCTYPE html>
<html>
<body>
<h1>Hello World</h1>
</body>
</html></textarea>

<div class="buttons">
    <button id="run">Run ▶</button>
    <button id="ai">AI Fix 🤖</button>
    <button id="clear">Clear</button>
</div>

</div>

<!-- RIGHT SIDE -->
<div id="preview">
<iframe id="frame"></iframe>
</div>

</div>

<script>

const code = document.getElementById("code");
const frame = document.getElementById("frame");

// ▶ RUN CODE
document.getElementById("run").onclick = () => {
    frame.srcdoc = code.value;
};

// 🧠 CLEAR
document.getElementById("clear").onclick = () => {
    code.value = "";
    frame.srcdoc = "";
};

// 🤖 AI BUTTON (FULL AGENT MODE)
document.getElementById("ai").onclick = async () => {

    const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            message: "Fix, improve and explain this code:\n\n" + code.value
        })
    });

    const data = await res.json();

    const reply = data.reply || "No response from AI";

    alert(reply);
};

</script>

</body>
</html>
