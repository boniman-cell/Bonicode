<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BONICODE</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        #chat { height: 70vh; overflow-y: auto; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .msg { margin-bottom: 15px; line-height: 1.5; font-size: 14px; }
        .op { color: #888; font-weight: bold; }
        .ai { color: #fff; }
        #box { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 8px; outline: none; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 15px; margin-top: 10px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat">
        <div class="msg">System: Ready for command.</div>
    </div>
    <input type="text" id="box" placeholder="Type here...">
    <button id="btn">RUN COMMAND</button>

    <script>
        // PASTE YOUR GSK_ KEY INSIDE THE QUOTES BELOW
        const KEY = "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";

        document.getElementById('btn').onclick = async () => {
            const input = document.getElementById('box');
            const chat = document.getElementById('chat');
            const val = input.value;
            if(!val) return;

            chat.innerHTML += `<div class="msg"><span class="op">YOU:</span> ${val}</div>`;
            input.value = '';

            try {
                const res = await fetch('https://groq.com', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [{role: "user", content: val}]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                chat.innerHTML += `<div class="msg"><span class="ai">AI:</span> ${reply}</div>`;
            } catch(e) {
                chat.innerHTML += `<div class="msg" style="color:red">ERROR: Bridge Failed. Check Key.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        };
    </script>
</body>
</html>
