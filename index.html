<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <style>
        body { font-family: Arial; background:#111; color:#fff; }
        #chat { height:80vh; overflow-y:auto; padding:10px; }
        .msg { margin:10px 0; padding:10px; background:#222; border-radius:8px; }
        .label { color:#00ffcc; font-weight:bold; display:block; margin-bottom:5px; }
        #box { width:75%; padding:10px; }
        #btn { padding:10px; }
    </style>
</head>

<body>

<div id="chat"></div>

<input id="box" placeholder="Type message..." />
<button id="btn">Send</button>

<script>
document.getElementById('btn').onclick = async () => {
    const input = document.getElementById('box');
    const chat = document.getElementById('chat');
    const val = input.value;

    if (!val) return;

    chat.innerHTML += `<div class="msg"><span class="label">You</span>${val}</div>`;
    input.value = '';

    const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: val })
    });

    const data = await res.json();

    chat.innerHTML += `
        <div class="msg">
            <span class="label">AI</span>
            ${data.reply || data.error}
        </div>
    `;

    chat.scrollTop = chat.scrollHeight;
};
</script>
<!-- test deploy -->
</body>
</html>
