<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BONICODE</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding-bottom: 20px; }
        .msg { margin-bottom: 15px; line-height: 1.6; font-size: 14px; border-left: 2px solid #222; padding-left: 12px; }
        .label { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #555; display: block; margin-bottom: 4px; }
        #input-area { background: #000; padding: 20px 0; border-top: 1px solid #111; }
        #box { width: 100%; background: #0a0a0a; border: 1px solid #222; color: #fff; padding: 16px; border-radius: 8px; outline: none; box-sizing: border-box; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 16px; margin-top: 10px; border-radius: 8px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat">
        <div class="msg"><span class="label">System</span>Neural Engine Ready.</div>
    </div>
    <div id="input-area">
        <input type="text" id="box" placeholder="TYPE COMMAND...">
        <button id="btn">RUN ENGINE</button>
    </div>

    <script>
        // 🔑 PASTE YOUR ENTIRE GSK_ KEY IN THE QUOTES BELOW
        const API_KEY = "";

        document.getElementById('btn').onclick = async () => {
            const input = document.getElementById('box');
            const chat = document.getElementById('chat');
            const val = input.value;
            if(!val) return;

            chat.innerHTML += `<div class="msg"><span class="label">Operator</span>${val}</div>`;
            input.value = '';

            try {
                const res = await fetch('https://groq.com', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [{role: "user", content: val}]
                    })
                });
                const data = await res.json();
                const reply = data.choices.message.content;
                chat.innerHTML += `<div class="msg"><span class="label" style="color:#fff">Bonicode_Agent</span>${reply}</div>`;
            } catch(e) {
                chat.innerHTML += `<div class="msg" style="color:red">ERROR: Bridge Failed. Re-check API Key.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        };
    </script>
</body>
</html>
